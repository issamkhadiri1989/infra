services:
    mongodb:
        image: "mongo"
        volumes:
            - "mongodb_data:/data/db"
        restart: "on-failure"
        networks:
            - symfony

    mongo-express:
        networks:
            - symfony
        image: mongo-express
        restart: always
        ports:
            - "8081:8081"
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: root
            ME_CONFIG_MONGODB_ADMINPASSWORD: example
            ME_CONFIG_MONGODB_URL: mongodb://root:example@mongodb:27017/
            ME_CONFIG_BASICAUTH_USER: ""
            ME_CONFIG_BASICAUTH_PASS: ""

volumes:
  mongodb_data:

networks:
  symfony:
    name: symfony
