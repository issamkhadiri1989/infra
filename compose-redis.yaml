services:
    redis:
        image: redis:latest
        ports:
            - "6379:6379"
        networks:
            - symfony

    redis-commander:
        image: rediscommander/redis-commander:latest
        environment:
            - REDIS_HOSTS=local:redis:6379
        ports:
            - "8083:8081"
        networks:
            - symfony

networks:
  symfony:
    name: symfony
