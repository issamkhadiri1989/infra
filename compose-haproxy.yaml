services:
    #examples of containers that will be held by the load balancer
    frontal-server-3:
        container_name: frontal-server-3
        build:
            context: ./infra/web
            args:
                BUILD_ARGUMENT_ENV: dev
            dockerfile: ./nginx/Dockerfile
        restart: always
        ports:
            - "9003:80"
            - "4433:443"
        expose:
            - 80
        volumes:
            - ./web:/var/www/html:ro,cached
            - ./infra/web/nginx/conf.d:/etc/nginx/conf.d
        networks:
            public_net:
                ipv4_address: 192.168.0.33

    frontal-server-2:
        container_name: frontal-server-2
        build:
            context: ./infra/web
            args:
                BUILD_ARGUMENT_ENV: dev
            dockerfile: ./nginx/Dockerfile
        restart: always
        ports:
            - "9002:80"
            - "4432:443"
        expose:
            - 80
        volumes:
            - ./web:/var/www/html:ro,cached
            - ./infra/web/nginx/conf.d:/etc/nginx/conf.d
        networks:
            public_net:
                ipv4_address: 192.168.0.22

    frontal-server-1:
        container_name: frontal-server-1
        build:
            context: ./infra/web
            args:
                BUILD_ARGUMENT_ENV: dev
            dockerfile: ./nginx/Dockerfile
        restart: always
        ports:
            - "9001:80"
            - "4431:443"
        expose:
            - 80
        volumes:
            - ./web:/var/www/html:ro,cached
            - ./infra/web/nginx/conf.d:/etc/nginx/conf.d
        networks:
            public_net:
                ipv4_address: 192.168.0.11

    haproxy:
        build: ./infra/haproxy
        ports:
            - 80:80
        expose:
            - 80
        networks:
            public_net:
                ipv4_address: 192.168.0.44
        environment:
            - APACHE_1_IP=192.168.0.11
            - APACHE_2_IP=192.168.0.22
            - APACHE_3_IP=192.168.0.33
            - APACHE_EXPOSED_PORT=80

    # server that will host the source code
    web_server:
        build:
            context: ./infra/web
            dockerfile: ./php/Dockerfile
        volumes:
            - ./web:/var/www/html:cached
            - ./infra/web/php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
            - ./infra/web/php/config/php.ini:/usr/local/etc/php/php.ini
            - ./infra/web/php/xdebug/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        networks:
            public_net:
                ipv4_address: 192.168.0.55
        expose:
            - "9000"
            - "9003"

volumes:
    db_admin_data:
    mysql:
    mysql_user:
    esdata:

networks:
    public_net:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 192.168.0.0/24