services:
    minio:
        image: minio/minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: your-access-key
            MINIO_ROOT_PASSWORD: your-secret-key
        volumes:
            - ./minio_data:/data
        command: server /data --console-address ":9001"
        networks:
            - symfony
    
volumes:
  db_admin_data:
  mysql:

networks:
  symfony:
    name: symfony
